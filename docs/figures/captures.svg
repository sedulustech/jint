<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 516" width="600" height="516" role="img" aria-label="A TypeScript file, the queries.scm patterns that match it, and the elements they produce"><g><text x="0" y="12" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--muted, #5c5c57)" xml:space="preserve">the file</text><rect x="0" y="20" width="600" height="156" rx="2" style="fill:var(--code-bg, #e8e6dc)"/><text x="10" y="36" style="font-family:var(--font-body, monospace);font-size:10px;fill:var(--muted, #5c5c57)" xml:space="preserve">1</text><text x="34" y="36" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">// Retry helpers for the upstream client.</text><text x="10" y="52" style="font-family:var(--font-body, monospace);font-size:10px;fill:var(--muted, #5c5c57)" xml:space="preserve">2</text><text x="34" y="52" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">// Every helper here backs off exponentially.</text><text x="10" y="68" style="font-family:var(--font-body, monospace);font-size:10px;fill:var(--muted, #5c5c57)" xml:space="preserve">3</text><text x="34" y="68" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--muted, #5c5c57)" xml:space="preserve"></text><text x="10" y="84" style="font-family:var(--font-body, monospace);font-size:10px;fill:var(--muted, #5c5c57)" xml:space="preserve">4</text><text x="34" y="84" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">/** Retries a request until it succeeds. */</text><text x="10" y="100" style="font-family:var(--font-body, monospace);font-size:10px;fill:var(--muted, #5c5c57)" xml:space="preserve">5</text><text x="34" y="100" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--muted, #5c5c57)" xml:space="preserve">export async function retry(request) {</text><text x="10" y="116" style="font-family:var(--font-body, monospace);font-size:10px;fill:var(--muted, #5c5c57)" xml:space="preserve">6</text><text x="34" y="116" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">  // the upstream rate-limits bursts, so each retry</text><text x="10" y="132" style="font-family:var(--font-body, monospace);font-size:10px;fill:var(--muted, #5c5c57)" xml:space="preserve">7</text><text x="34" y="132" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">  // waits twice as long as the last</text><text x="10" y="148" style="font-family:var(--font-body, monospace);font-size:10px;fill:var(--muted, #5c5c57)" xml:space="preserve">8</text><text x="34" y="148" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--muted, #5c5c57)" xml:space="preserve">  await sleep(delay);</text><text x="10" y="164" style="font-family:var(--font-body, monospace);font-size:10px;fill:var(--muted, #5c5c57)" xml:space="preserve">9</text><text x="34" y="164" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--muted, #5c5c57)" xml:space="preserve">}</text><path d="M555,27 H560 V54 H555" style="fill:none;stroke:var(--fg, #000);stroke-width:1.2"/><text x="565" y="44.5" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000);font-weight:600" xml:space="preserve">A</text><path d="M555,75 H560 V86 H555" style="fill:none;stroke:var(--fg, #000);stroke-width:1.2"/><text x="565" y="84.5" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000);font-weight:600" xml:space="preserve">B</text><path d="M535,107 H540 V134 H535" style="fill:none;stroke:var(--fg, #000);stroke-width:1.2"/><text x="545" y="124.5" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000);font-weight:600" xml:space="preserve">C</text><path d="M555,91 H560 V166 H555" style="fill:none;stroke:var(--fg, #000);stroke-width:1.2"/><text x="565" y="132.5" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000);font-weight:600" xml:space="preserve">D</text><text x="0" y="200" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--muted, #5c5c57)" xml:space="preserve">queries.scm (typescript): each pattern gives a node a capture; #set! adds a fact</text><rect x="0" y="208" width="600" height="172" rx="2" style="fill:var(--code-bg, #e8e6dc)"/><text x="10" y="226" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000);font-weight:600" xml:space="preserve">A</text><text x="44" y="226" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">((program . (comment) @comment)</text><text x="44" y="241" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">  (#set! "docstring.owner" "module")) ; @priority</text><text x="44" y="256" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--muted, #5c5c57)" xml:space="preserve">; the first node of the file: the header documents the file</text><text x="10" y="278" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000);font-weight:600" xml:space="preserve">B C</text><text x="44" y="278" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">((comment) @comment</text><text x="44" y="293" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">  (#set! "capture.comment.merge" "contiguous")) ; @priority</text><text x="44" y="308" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--muted, #5c5c57)" xml:space="preserve">; every comment; rows with nothing between them join into one</text><text x="10" y="330" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000);font-weight:600" xml:space="preserve">D</text><text x="44" y="330" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">(export_statement declaration:</text><text x="44" y="345" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">  (function_declaration name: (identifier) @name)) @function ; @priority</text><text x="44" y="360" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--muted, #5c5c57)" xml:space="preserve">; an exported function, named by @name</text><text x="0" y="404" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--muted, #5c5c57)" xml:space="preserve">the elements jint judges (jint capture shows them)</text><rect x="0" y="412" width="600" height="96" rx="2" style="fill:var(--code-bg, #e8e6dc)"/><text x="10" y="430" style="font-family:var(--font-body, monospace);font-size:10px;fill:var(--muted, #5c5c57)" xml:space="preserve"></text><text x="44" y="430" style="font-family:var(--font-body, monospace);font-size:10px;fill:var(--muted, #5c5c57)" xml:space="preserve">id</text><text x="80" y="430" style="font-family:var(--font-body, monospace);font-size:10px;fill:var(--muted, #5c5c57)" xml:space="preserve">capture</text><text x="152" y="430" style="font-family:var(--font-body, monospace);font-size:10px;fill:var(--muted, #5c5c57)" xml:space="preserve">span</text><text x="206" y="430" style="font-family:var(--font-body, monospace);font-size:10px;fill:var(--muted, #5c5c57)" xml:space="preserve">belongs to</text><text x="10" y="448" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000);font-weight:600" xml:space="preserve">A</text><text x="44" y="448" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">c0</text><text x="80" y="448" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">comment</text><text x="152" y="448" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">L1-L2</text><text x="206" y="448" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">the module</text><text x="10" y="464" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000);font-weight:600" xml:space="preserve">B</text><text x="44" y="464" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">c1</text><text x="80" y="464" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">comment</text><text x="152" y="464" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">L4</text><text x="206" y="464" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">function retry: attached, the line directly above it</text><text x="10" y="480" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000);font-weight:600" xml:space="preserve">D</text><text x="44" y="480" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">d0</text><text x="80" y="480" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">function</text><text x="152" y="480" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">L5-L9</text><text x="206" y="480" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">retry, carrying c1 as its documentation</text><text x="10" y="496" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000);font-weight:600" xml:space="preserve">C</text><text x="44" y="496" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">c2</text><text x="80" y="496" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">comment</text><text x="152" y="496" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">L6-L7</text><text x="206" y="496" style="font-family:var(--font-body, monospace);font-size:11px;fill:var(--fg, #000)" xml:space="preserve">function retry: two rows, one element</text></g></svg>
