<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jint measurement ui</title>
    <script>
      // set the theme class BEFORE first paint so light-theme users never flash dark
      (function () {
        try {
          var t = localStorage.getItem("jint-theme");
          var dark =
            t === "dark" ||
            ((t === null || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
