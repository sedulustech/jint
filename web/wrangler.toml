# Pages build settings (dashboard, they are not in this file): root directory = repo root, build command =
# `bun run web:build` (tests, docs freshness, build), output = web/dist.
#
# Cloudflare Pages project for the jint site. The binaries mirror is a Pages Function
# (functions/dl) reading the R2 bucket bound below; the publish-binaries workflow fills it.
name = "jint-web"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

[[r2_buckets]]
binding = "BINARIES"
bucket_name = "jint-releases"
