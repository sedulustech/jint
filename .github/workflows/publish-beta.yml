name: Publish beta

# The beta channel: every binary-changing push to the beta branch builds all four targets with the
# same jobs a release uses, then publishes them to the site's R2 bucket under
# download/beta-<first 6 of the commit>/. Exactly one build exists at a time: the publish deletes
# the previous one. download/beta/COMMIT names the current commit, and the site redirects
# download/beta/<asset> to that build. No tag, no GitHub release - the bucket is the only place a
# beta lives. install.sh reads the pointer, then the build, from RELEASE_BASE=<site>/dl.

# Everything triggers a build except what plainly never reaches the binary: the site and its
# function, the docs and their generator, demos, root tests, the npm and release
# packaging, repo-root prose and config, and the other workflows. A new top-level path therefore
# builds until it is listed here; dispatch builds on demand.
on:
  push:
    branches: [feat/decisions-model]
    paths-ignore:
      - "web/**"
      - "functions/**"
      - "wrangler.toml"
      - "docs/**"
      - "demo/**"
      - "tests/**"
      - "npm/**"
      - "scripts/generate-schema*"
      - "scripts/pack-npm.ts"
      - "scripts/parity.ts"
      - "scripts/publish-npm.sh"
      - "scripts/verify-install.sh"
      - "install.sh"
      - "*.md"
      - "LICENSE"
      - "logo.svg"
      - "jint.config.ts"
      - "jint.schema.json"
      - ".githooks/**"
      - ".oxlint/**"
      - ".oxlintignore"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish-binaries.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/sign-notarize.yml"
  workflow_dispatch:

permissions:
  contents: read

# a newer push supersedes a running one: the bucket must end on the newest commit
concurrency:
  group: publish-beta
  cancel-in-progress: true

env:
  BUCKET: jint-releases

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-binaries.yml
    with:
      beta: true
    secrets: inherit

  publish:
    name: Publish the beta build to R2
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
      - name: Tar the binaries + smoke-test the linux one
        run: |
          # same packaging as the release: every tarball carries its member as `jint`
          cd dist/jint-linux-x64 && tar -czf ../../jint-linux-x64.tar.gz jint && cd ../..
          cd dist/jint-linux-arm64 && mv jint-linux-arm64 jint && tar -czf ../../jint-linux-arm64.tar.gz jint && cd ../..
          cd dist/jint-darwin-notarized \
            && for b in jint-darwin-arm64 jint-darwin-x64; do mv "$b" jint && tar -czf "../../${b}.tar.gz" jint && mv jint "$b"; done && cd ../..
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke
          tar -xzf jint-linux-x64.tar.gz -C /tmp/smoke
          chmod +x /tmp/smoke/jint && /tmp/smoke/jint --version
          # the binary names its build: beta-<sha6>, the directory this publish writes
          test "$(/tmp/smoke/jint --version)" = "beta-${GITHUB_SHA:0:6}"
          sha256sum jint-*.tar.gz > checksums.txt && cat checksums.txt
          # the commit a beta was built from; the pointer download/beta/COMMIT holds it
          echo "$GITHUB_SHA" > COMMIT
      - name: Publish download/beta-<sha6>/, point at it, delete the previous build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          r2() { npx --yes wrangler@4 r2 object "$@" --remote; }
          assets="jint-darwin-arm64.tar.gz jint-darwin-x64.tar.gz jint-linux-arm64.tar.gz jint-linux-x64.tar.gz checksums.txt"
          dir="download/beta-${GITHUB_SHA:0:6}"
          # the build that is current now, if any: read before the pointer moves
          if r2 get "$BUCKET/download/beta/COMMIT" --file previous-commit 2>/dev/null; then
            previous="download/beta-$(head -c 6 previous-commit)"
          else
            previous=""
          fi
          for f in $assets; do r2 put "$BUCKET/$dir/$f" --file "$f"; done
          r2 put "$BUCKET/download/beta/COMMIT" --file COMMIT
          # exactly one build exists: drop the one the pointer just left (never the one just written)
          if [ -n "$previous" ] && [ "$previous" != "$dir" ]; then
            for f in $assets; do r2 delete "$BUCKET/$previous/$f" || true; done
          fi
