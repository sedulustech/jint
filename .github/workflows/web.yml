name: Website

# The site's checks, run only when something the site reads changes: its own files, the docs it
# renders, the rules and types its config imports, and the install inputs. `bun run web:build` is
# also Cloudflare Pages' build command: schema and docs freshness, the type check, the site's tests,
# then the build.
on:
  push:
    branches: [main]
    paths: &site
      - "web/**"
      - "docs/**"
      - "packages/sdk/src/docs.ts"
      - "packages/sdk/src/sdk.d.ts"
      - "packages/rules/**"
      - "scripts/generate-schema.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths: *site
  workflow_dispatch:

jobs:
  site:
    name: Check & build the site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Check and build
        run: bun run web:build
