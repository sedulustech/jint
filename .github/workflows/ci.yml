name: CI Build & Test

# paths-ignore lists only what cannot affect the build or the suite: a mistake here costs an
# extra run, never a missed one. The site is Cloudflare Pages' (its build command is `bun run web:build`: tests,
# docs freshness, then the build). Everything else,
# including docs/ (generated, freshness-tested) and the root files, still runs the full matrix.
on:
  push:
    branches: [main]
    paths-ignore: &inert
      - "web/**"
      - "RELEASING.md"
      - "LICENSE"
      - ".github/workflows/publish-beta.yml"
      - ".github/workflows/publish-binaries.yml"
  pull_request:
    branches: [main]
    paths-ignore: *inert
  # manual rerun button: the macos arm64 queue can idle for minutes and one green
  # rerun beats an empty commit when a job was transient
  workflow_dispatch:

jobs:
  # install.sh against every branch it has (platform and libc detection, checksum failure, wget-only);
  # stub binaries, a local server, no network: the script, not the binary, is what is under test
  install-script:
    name: install.sh
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Verify install.sh
        run: STAGE_STUBS=1 bash scripts/verify-install.sh

  matrix-build:
    name: Build & Test (${{ matrix.os }} - Bun ${{ matrix.bun-version }})
    strategy:
      # One failing matrix job must not cancel the others
      fail-fast: false
      matrix:
        # pinned, not -latest: ubuntu-latest migrates to 26.04 on 2026-10-19 and
        # builds must stay reproducible across that switch. macos-latest resolves to
        # macOS 26 arm64 (the image the first green matrix ran on); macos-15-arm64
        # sat in a contended queue that day and macos-14 is deprecated (issue #13518)
        os: [ubuntu-24.04, macos-26]
        # developed on 1.4.x; setup-bun's 'latest' resolved to 1.4.2 anyway,
        # so the second leg added concurrency and flake surface, not signal
        bun-version: [1.4.x]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      # the global bun install cache (actions/cache's documented Bun recipe): keyed on the
      # lockfile, so dependency changes miss and rebuild, everything else restores warm
      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          # partial hits on the OS prefix still restore most packages across lockfile bumps
          restore-keys: |
            ${{ runner.os }}-bun-

      # 'bun ci' enforces exact versions from bun.lock and fails if package.json is out of sync
      - name: Install dependencies
        run: bun ci

      # build BEFORE test: the W5 bin-liveness test (tests/cli.bin.test.ts) spawns the BUILT
      # entry (packages/cli/dist/cli.js) — it skips itself when dist/ is absent
      - name: Build
        run: bun run build

      - name: Run Tests
        # serial on purpose: nearly every case spawns its own CLI process and the
        # 2-vCPU runner cannot hold ~39 concurrent files of that without starving
        # whichever spawn is tail-most, which surfaced as 5000ms timeouts. A quiet
        # machine is worth the extra wall-clock; the suite is process-bound, not
        # CPU-bound, so concurrency bought flake rather than speed.
        run: bun test
