name: CI Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # manual rerun button: the macos arm64 queue can idle for minutes and one green
  # rerun beats an empty commit when a job was transient
  workflow_dispatch:

jobs:
  matrix-build:
    name: Build & Test (${{ matrix.os }} - Bun ${{ matrix.bun-version }})
    strategy:
      # One failing matrix job must not cancel the others
      fail-fast: false
      matrix:
        # pinned, not -latest: ubuntu-latest migrates to 26.04 on 2026-10-19,
        # and builds must stay reproducible across that switch
        os: [ubuntu-24.04, macos-15-arm64]
        # The repo is developed on 1.4.x; latest catches forward breakage
        bun-version: [1.4.x, latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      # 'bun ci' enforces exact versions from bun.lock and fails if package.json is out of sync
      - name: Install dependencies
        run: bun ci

      # build BEFORE test: the W5 bin-liveness test (tests/cli.bin.test.ts) spawns the BUILT
      # entry (packages/cli/dist/cli.js) — it skips itself when dist/ is absent
      - name: Build
        run: bun run build

      - name: Run Tests
        env:
          # W5 (the bin-liveness test) makes one real classification; every other test
          # blanks the key in its spawn env, so the runtime key leaks nowhere else
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: bun test
