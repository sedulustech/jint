name: CI Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # manual rerun button: the macos arm64 queue can idle for minutes and one green
  # rerun beats an empty commit when a job was transient
  workflow_dispatch:

jobs:
  matrix-build:
    name: Build & Test (${{ matrix.os }} - Bun ${{ matrix.bun-version }})
    strategy:
      # One failing matrix job must not cancel the others
      fail-fast: false
      matrix:
        # pinned, not -latest: ubuntu-latest migrates to 26.04 on 2026-10-19 and
        # builds must stay reproducible across that switch. macos-latest resolves to
        # macOS 26 arm64 (the image the first green matrix ran on); macos-15-arm64
        # sat in a contended queue that day and macos-14 is deprecated (issue #13518)
        os: [ubuntu-24.04, macos-26]
        # developed on 1.4.x; setup-bun's 'latest' resolved to 1.4.2 anyway,
        # so the second leg added concurrency and flake surface, not signal
        bun-version: [1.4.x]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      # 'bun ci' enforces exact versions from bun.lock and fails if package.json is out of sync
      - name: Install dependencies
        run: bun ci

      # build BEFORE test: the W5 bin-liveness test (tests/cli.bin.test.ts) spawns the BUILT
      # entry (packages/cli/dist/cli.js) — it skips itself when dist/ is absent
      - name: Build
        run: bun run build

      - name: Run Tests
        env:
          # W5 (the bin-liveness test) makes one real classification; every other test
          # blanks the key in its spawn env, so the runtime key leaks nowhere else
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        # serial on purpose: nearly every case spawns its own CLI process and the
        # 2-vCPU runner cannot hold ~39 concurrent files of that without starving
        # whichever spawn is tail-most, which surfaced as 5000ms timeouts. A quiet
        # machine is worth the extra wall-clock; the suite is process-bound, not
        # CPU-bound, so concurrency bought flake rather than speed.
        run: bun test
