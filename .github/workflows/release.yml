name: Release

# Draft-then-publish: a tag push builds every target and attaches them to a DRAFT release
# with seeded notes; a human edits the prose and presses Publish. Nothing is public before
# the click, and merges can never trigger this (tags are the only release trigger).
# The runbook is RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to draft a release for (dry runs; defaults to the branch ref, which will fail --verify-tag)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-binaries.yml
    secrets: inherit

  release:
    name: Draft release
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      # full history + tags: the notes seed walks <prev-tag>..<tag>
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
      - name: Tar the binaries + smoke-test the linux one
        run: |
          # one tar.gz per target - a single wrapped file per platform downloads (and curls)
          # cleanly; the smoke test runs the binary FROM the tarball, so what ships is what ran
          # every tarball carries its member as `jint` - install.sh extracts $tmp/jint
          cd dist/jint-linux-x64 && tar -czf ../../jint-linux-x64.tar.gz jint && cd ../..
          cd dist/jint-linux-arm64 && mv jint-linux-arm64 jint && tar -czf ../../jint-linux-arm64.tar.gz jint && cd ../..
          cd dist/jint-darwin-notarized \
            && for b in jint-darwin-arm64 jint-darwin-x64; do mv "$b" jint && tar -czf "../../${b}.tar.gz" jint && mv jint "$b"; done && cd ../..
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke
          tar -xzf jint-linux-x64.tar.gz -C /tmp/smoke
          chmod +x /tmp/smoke/jint && /tmp/smoke/jint --version
      # install.sh verifies against this - GNU sha256sum format, one line per asset
      - name: Checksums
        run: sha256sum jint-*.tar.gz > checksums.txt && cat checksums.txt
      - name: Seed notes (one line per commit since the previous tag)
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PREV=$(git tag -l --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          {
            echo '<!-- EDIT ME: one or two sentences on what this release is -->'
            echo
            if [ -n "$PREV" ]; then
              git log "$PREV..$TAG" --oneline --no-merges
            else
              git log -n 300 --oneline --no-merges
            fi
            echo
            echo "**Full Changelog**: https://github.com/sedulustech/jint/commits/$TAG"
            echo
            echo "npm tarballs (@sedulus/jint + four platform packages) are NOT attached here -"
            echo "they are workflow artifacts of this run:"
            echo "https://github.com/sedulustech/jint/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/release-body.md
          cat /tmp/release-body.md
      # draft only: a human edits the prose and publishes; the tag must match the checkout
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft --verify-tag \
            --title "$TAG" \
            --notes-file /tmp/release-body.md \
            jint-linux-x64.tar.gz \
            jint-linux-arm64.tar.gz \
            jint-darwin-arm64.tar.gz \
            jint-darwin-x64.tar.gz \
            checksums.txt

  pack-npm:
    name: Pack npm tarballs
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.x
      # the global bun install cache (actions/cache's documented Bun recipe), SHA-pinned
      # like every action in release files; keyed on the lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
      - run: mkdir -p out && cp dist/jint-linux-x64/jint out/jint-linux-x64 && cp dist/jint-linux-arm64/jint-linux-arm64 out/jint-linux-arm64 && cp dist/jint-darwin-notarized/jint-darwin-arm64 out/jint-darwin-arm64 && cp dist/jint-darwin-notarized/jint-darwin-x64 out/jint-darwin-x64
      # PACK-ONLY: the tarballs are workflow artifacts, attached nowhere - they
      # publish (from the tag) in the commented job below once the gate opens
      - run: bun scripts/pack-npm.ts "${{ inputs.tag || github.ref_name }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-tarballs
          path: dist-npm/*.tgz
          if-no-files-found: error

  # Publish joins the fan-in AFTER the draft exists (needs: release) and only on
  # tag builds - merges can draft nothing and publish less. The guard in
  # publish-npm.sh makes a retried run a no-op; prereleases land under the rc
  # dist-tag so latest never points at a rehearsal.
  publish-npm:
    name: Publish npm packages
    needs: [release, pack-npm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-tarballs
          path: dist-npm
      - run: scripts/publish-npm.sh dist-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_sedulus_scope }}
